name: 보행망 파일 준비

on:
  push:
    branches: [work]
    paths: [config/walking-data.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: walking-data
  cancel-in-progress: false

jobs:
  prepare:
    name: 공개 보행망 파일 가공
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 소스 가져오기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: 파일 처리 도구 설치
        run: python3 -m pip install osmium==4.3.2
      - name: 자료 처리 검사
        run: python3 -m unittest discover -s tests -p 'test_walking.py'
      - name: 공개 원본 다운로드
        run: |
          walking_source=$(python3 -c 'import json; value=json.load(open("config/walking-data.json"))["source"]; assert value == "https://download.geofabrik.de/asia/south-korea-latest.osm.pbf"; print(value)')
          curl --fail --location --retry 2 --max-time 600 "$walking_source" -o /tmp/galmanzip-walking.osm.pbf
      - name: 보행 가능 연결 가공
        run: python3 scripts/build_walking.py --source /tmp/galmanzip-walking.osm.pbf --output public/data/walking
      - name: 검토용 자료 브랜치에 보관
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/walking
          git commit -m '서울·경기 보행망 파일 생성'
          git push origin "HEAD:refs/heads/data/walking-network-${GITHUB_RUN_ID}"
