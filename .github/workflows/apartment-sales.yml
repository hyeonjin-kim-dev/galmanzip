name: 아파트 실거래가 준비

on:
  push:
    branches: [work]
    paths: [config/sales-request.json]
  workflow_dispatch:
  schedule:
    - cron: '23 17 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: apartment-sales
  cancel-in-progress: false

jobs:
  prepare:
    name: 국토교통부 매매 자료 준비
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 소스 가져오기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: 실거래가 처리 검사
        run: python3 -m unittest discover -s tests -p 'test_sales.py'
      - name: 매매 실거래 자료 수집
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: python3 scripts/prepare_sales.py --output public/data/sales
      - name: 검토 자료 보관
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/sales
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m '아파트 최근 매매 실거래가 갱신'
          if [ "$GITHUB_REF" = 'refs/heads/main' ]; then
            git pull --rebase origin main
            git push origin HEAD:main
          else
            git push origin "HEAD:refs/heads/data/apartment-sales-${GITHUB_RUN_ID}"
          fi
      - name: 갱신 자료 자동 배포
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
