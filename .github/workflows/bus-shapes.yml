name: 버스 도로 좌표 준비

on:
  push:
    branches: [main]
    paths: [config/bus-shapes-request.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bus-road-shapes
  cancel-in-progress: false

jobs:
  prepare:
    name: 실제 버스 노선 좌표 준비
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 소스 가져오기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Node.js 준비
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: 좌표 처리 검사
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: GBIS 전체 파일 다운로드
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: python3 scripts/bus_files.py --download /tmp/galmanzip-bus-files
      - name: 전체 원본 파일과 해시 보관
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bus-base-files
          path: /tmp/galmanzip-bus-files
          retention-days: 7
      - name: 파일 형식 확인용 일부 행 보관
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bus-base-samples
          path: /tmp/galmanzip-bus-files/samples
          retention-days: 7
      - name: 전체 파일과 기존 교통 자료 대조
        run: python3 scripts/bus_files.py --files /tmp/galmanzip-bus-files --output /tmp/galmanzip-bus-shapes
      - name: 배포 전 좌표 검증
        run: node --experimental-strip-types scripts/validate-bus-shapes.ts /tmp/galmanzip-bus-shapes
      - name: 검증한 좌표와 보고서 보관
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bus-road-shapes
          path: /tmp/galmanzip-bus-shapes
          retention-days: 7
